<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 100" aria-labelledby="title desc">
  <title id="title">Derry's Restaurant Logo</title>
  <desc id="desc">Elegant restaurant logo with fork, spoon, and plate elements</desc>
  
  <defs>
    <linearGradient id="plateGrad" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f5e6d3"/>
      <stop offset="100%" stop-color="#e8d5bb"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" x2="1">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#ffb700"/>
    </linearGradient>
  </defs>
  
  <!-- Subtle background for logo area -->
  <circle cx="50" cy="50" r="44" fill="rgba(255,255,255,0.08)" stroke="none"/>
  
  <!-- Main plate circle background -->
  <circle cx="50" cy="50" r="42" fill="url(#plateGrad)" stroke="url(#accentGrad)" stroke-width="2.5"/>
  
  <!-- Inner decorative plate rim -->
  <circle cx="50" cy="50" r="38" fill="none" stroke="#ffd700" stroke-width="1.5" opacity="0.6" stroke-dasharray="3,2"/>
  
  <!-- Fork (left) -->
  <g transform="translate(28, 50)">
    <!-- Handle -->
    <rect x="-2.5" y="28" width="5" height="22" fill="#1a0f08" rx="2.5"/>
    <!-- Prongs -->
    <rect x="-15" y="-28" width="4" height="56" fill="#1a0f08" rx="1.5"/>
    <rect x="-4" y="-28" width="4" height="56" fill="#1a0f08" rx="1.5"/>
    <rect x="7" y="-28" width="4" height="56" fill="#1a0f08" rx="1.5"/>
    <!-- Prong connectors -->
    <path d="M -13 -10 Q 0 -8 9 -10" stroke="#1a0f08" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
  
  <!-- Spoon (right) -->
  <g transform="translate(72, 50)">
    <!-- Handle -->
    <path d="M 0 28 L 0 50 Q 0 52 -2 52 L 2 52 Q 0 52 0 50 Z" fill="#1a0f08"/>
    <!-- Bowl with gradient -->
    <ellipse cx="0" cy="-16" rx="14" ry="18" fill="#1a0f08"/>
    <ellipse cx="-3" cy="-18" rx="10" ry="12" fill="#3a2a20" opacity="0.4"/>
  </g>
  
  <!-- Center plate with food accent -->
  <circle cx="50" cy="50" r="26" fill="#fffbf7" stroke="#ffd700" stroke-width="1.5" opacity="0.95"/>
  
  <!-- Decorative food elements in center -->
  <g transform="translate(50, 45)">
    <!-- Leaf 1 -->
    <ellipse cx="-6" cy="-2" rx="5" ry="8" fill="#b8860b" opacity="0.85" transform="rotate(-35)"/>
    <!-- Leaf 2 -->
    <ellipse cx="6" cy="0" rx="4" ry="7" fill="#daa520" opacity="0.75" transform="rotate(35)"/>
    <!-- Center accent -->
    <circle cx="0" cy="3" r="1.5" fill="#ffd700" opacity="0.9"/>
  </g>
  
  <!-- Accent dots around plate with brighter gold -->
  <circle cx="30" cy="30" r="1.5" fill="#ffd700" opacity="0.7"/>
  <circle cx="70" cy="30" r="1.5" fill="#ffd700" opacity="0.7"/>
  <circle cx="30" cy="70" r="1.5" fill="#ffd700" opacity="0.7"/>
  <circle cx="70" cy="70" r="1.5" fill="#ffd700" opacity="0.7"/>
  
  <!-- Text: Derry's - brighter gold -->
  <text x="130" y="38" font-family="Playfair Display, serif" font-size="32" font-weight="700" fill="#ffd700">Derry's</text>
  
  <!-- Text: Restaurant - bright gold -->
  <text x="130" y="60" font-family="Poppins, sans-serif" font-size="12" font-weight="500" fill="#ffb700" letter-spacing="1">RESTAURANT</text>
  
  <!-- Decorative line - brighter -->
  <line x1="130" y1="70" x2="275" y2="70" stroke="#ffd700" stroke-width="1.5" opacity="0.7"/>
</svg>
